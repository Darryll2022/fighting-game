<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fighting Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link 
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" 
    rel="stylesheet">
    <style>
        * {
            /* so that padding doesn't spoil ur overall */
            box-sizing: border-box;
            /* font change*/
            font-family: 'Press Start 2P', cursive;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #111827;
            color: #fff;
            gap: 12px;
            padding: 16px;
        }
        #controls {
            font-size: 12px;
            line-height: 1.6;
            text-align: center;
        }
        canvas {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <p id="controls">Player 1: A/D move, W jump, Space attack. Player 2: Left/Right move, Up jump, Down attack.</p>
    <!-- red container div ,, inline-block, take the full dim of the children which is the canvas in this case-->
    <div style="position: relative; display: inline-block;">
        <!-- smaller red container div -->
        <!-- absolute,taking out of document flow,, flex is to place side by side instead of on top of each other like blocks and to use align-items -->
        <div style="position: absolute; 
                    display: flex; 
                    width: 100%; 
                    align-items: center; 
                    padding: 20px ;"> 
            <!-- player health -->
            <div 
            style="
                position: relative; 
                width: 100%; 
                display: flex; 
                justify-content: flex-end; ">
                <div  
                style="
                background-color: red; 
                height: 30px; 
                width: 100%;">
                </div>
                <div id="playerHealth" role="progressbar" aria-label="Player 1 health" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" style="
                position: absolute; 
                background: #818CF8; 
                top: 0; right: 0; bottom: 0; 
                width: 100%; 
                border-top: 4px solid white;
                border-left: 4px solid white;
                border-bottom: 4px solid white;
                "
                >
                </div>
            </div>
            <!-- timer -->
            <div id="timer" role="timer" aria-live="polite" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"
            style="background-color: black; 
            height: 50px; width: 100px; 
            flex-shrink: 0; 
            display: flex; 
            align-items: center; justify-content: 
            center; color: white;
            border: 4px solid white;
            "
            >
            100
            </div>
            <!-- enemy health -->
            <div 
            style="
            position: relative; 
            width: 100% ">
                <div  style="
                background-color: red; 
                height: 30px;"></div>
                <div id="enemyHealth" role="progressbar" aria-label="Player 2 health" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" style="
                position: absolute; 
                background: #818CF8; 
                top: 0; 
                right: 0; 
                bottom: 0; 
                left: 0;
                border-top: 4px solid white;
                border-right: 4px solid white;
                border-bottom: 4px solid white;"></div>
            </div>
            <div></div>
        </div>
        <div id="displayText" role="status" aria-live="assertive" style="position: absolute; 
        color: white; display: 
        flex; align-items: center; 
        justify-content: center; 
        top: 0; right: 0; 
        bottom: 0; 
        left: 0; 
        display: none; ">Tie</div>
        <canvas aria-label="2D fighting game arena">Your browser does not support canvas.</canvas>
    </div>
    <!-- to animate health bar -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.3/gsap.min.js" integrity="sha512-gmwBmiTVER57N3jYS3LinA9eb8aHrJua5iQD7yqYCKa5x6Jjc7VDVaEA0je0Lu0bP9j7tEjV3+1qUm6loO99Kw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="js/utils.js"></script>
    <script src="js/classes.js"></script>
    <script src="index.js"></script>

</body>
</html>
